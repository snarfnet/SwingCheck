name: SwingCheck
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.swingcheck
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleIconName: AppIcon

targets:
  SwingCheck:
    type: application
    platform: iOS
    sources: [SwingCheck]
    settings:
      base:
        INFOPLIST_FILE: SwingCheck/Info.plist
        PRODUCT_NAME: SwingCheck
    info:
      path: SwingCheck/Info.plist
      properties:
        CFBundleName: SwingCheck
        CFBundleDisplayName: SwingCheck
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Camera is used to analyze your batting form."
        NSPhotoLibraryAddUsageDescription: "Save swing videos to your photo library."
